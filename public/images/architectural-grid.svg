<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#FACC15" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Obsidian Black Canvas -->
  <rect width="800" height="600" fill="#0A0A0C"/>
  <circle cx="400" cy="300" r="320" fill="url(#amberGlow)"/>

  <!-- Precision Architectural Grid -->
  <g stroke="#27272A" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="550" y1="0" x2="550" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Sovereign Orange & Solar Yellow Geometric Frame -->
  <rect x="130" y="80" width="540" height="440" rx="8" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.75"/>
  <rect x="165" y="115" width="470" height="370" rx="4" stroke="#FACC15" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Abstract Scales & Pillar of Law Geometry -->
  <line x1="400" y1="135" x2="400" y2="455" stroke="url(#brandGrad)" stroke-width="3"/>
  <circle cx="400" cy="135" r="8" fill="#FACC15"/>
  <path d="M240 215 C310 190, 490 190, 560 215" stroke="url(#brandGrad)" stroke-width="2.5" fill="none"/>
  <path d="M240 215 L205 320 L275 320 Z" stroke="#FB923C" stroke-width="1.75" fill="#EA580C" fill-opacity="0.12"/>
  <path d="M560 215 L525 320 L595 320 Z" stroke="#FACC15" stroke-width="1.75" fill="#FACC15" fill-opacity="0.12"/>
  <path d="M198 320 Q240 352 282 320 Z" fill="url(#brandGrad)"/>
  <path d="M518 320 Q560 352 602 320 Z" fill="url(#brandGrad)"/>

  <!-- Concentric Balance Rings -->
  <circle cx="400" cy="300" r="105" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="300" r="52" stroke="#EA580C" stroke-opacity="0.65" stroke-width="1.5"/>
  <rect x="330" y="455" width="140" height="8" rx="4" fill="url(#brandGrad)"/>
</svg>
